# Publishing a whisperlane release.
#
# A version tag is the only trigger. The tag is the statement of what
# is being published, so the workflow reads the version back out of the
# manifests and refuses to build when the tag and the manifests disagree:
# an installer whose name says one version and whose code is another is
# worse than no installer.
#
# The checks from the continuous integration workflow run again here,
# before the build. A tag that cannot pass them cannot become an
# installer.
#
# The release is created as a draft. It is verified by hand — the build
# is run, the installer is installed, a take is spoken — before anyone
# is told it exists. Signing is not part of this yet; an unsigned build
# says plainly that it is unsigned.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.8.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: The tag must match the version in the manifests
        shell: pwsh
        run: |
          $tag = ('{0}' -f (git tag --points-at HEAD | Select-Object -First 1))
          if (-not $tag) { throw 'this build is not on a tag' }

          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $toml = Get-Content apps/desktop/src-tauri/Cargo.toml -Raw
          $cargo = [regex]::Match($toml, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value

          $versions = @(@($pkg, $tauri, $cargo) | Sort-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "the manifests disagree on the version: $($versions -join ', ')"
          }
          if ($tag -ne "v$($versions[0])") {
            throw "tag $tag does not match the manifest version $($versions[0])"
          }
          Write-Host "building $tag"

      - name: Lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets

      - name: Typecheck
        working-directory: apps/desktop
        run: bunx tsc --noEmit

      - name: Stage the transcription runtime
        shell: pwsh
        run: |
          # The engine is pinned by tag and checksum. It travels with the
          # source when it is committed, and is fetched when it is not:
          # the installer must never ship without it.
          if (-not (Test-Path 'apps/desktop/src-tauri/runtime/whisper-server.exe')) {
            ./scripts/fetch-runtime.ps1 -Force
          }
          if (-not (Test-Path 'apps/desktop/src-tauri/runtime/whisper-server.exe')) {
            throw 'the transcription runtime is missing; the installer would ship without an engine'
          }

      - name: Build the installers
        working-directory: apps/desktop
        env:
          # Signing cannot be skipped: the updater refuses an artifact it
          # cannot verify, so an unsigned build is an update nobody can
          # install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Collect the installers
        shell: pwsh
        run: |
          $bundles = 'apps/desktop/src-tauri/target/release/bundle'
          $files = @()
          foreach ($pattern in @("$bundles/nsis/*.exe", "$bundles/msi/*.msi")) {
            $files += Get-ChildItem $pattern -ErrorAction SilentlyContinue
          }
          if ($files.Count -eq 0) {
            throw "no installer was produced under $bundles"
          }
          $files | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Write the checksums
        shell: pwsh
        run: |
          # One file for everyone who packages this release: winget and
          # scoop both refuse a download they cannot verify, and a user
          # checking a manual download deserves the same answer.
          $bundles = 'apps/desktop/src-tauri/target/release/bundle'
          $files = @()
          $files += Get-ChildItem "$bundles/nsis/*.exe"
          $files += Get-ChildItem "$bundles/msi/*.msi"
          if ($files.Count -eq 0) { throw 'nothing to hash' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $path = Join-Path (Get-Location).Path "$bundles/SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines($path, $lines)
          Get-Content $path | Write-Host

      - name: Write the update manifest
        shell: pwsh
        run: |
          # The updater reads this file before it downloads anything, so a
          # signature that is missing here is an update that never reaches
          # the user. The endpoint in tauri.conf.json points at the
          # "latest" release, which is why this file is attached to the
          # release rather than committed.
          $bundles = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          # Only an installer that carries a signature can be published:
          # picking the newest file blindly would find a stale one in a
          # workspace that has been built before.
          $installer = Get-ChildItem "$bundles/*.exe" |
            Where-Object { $_.Name -notlike '*.sig' -and (Test-Path "$($_.FullName).sig") } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'no signed NSIS installer to publish'
          }

          $sigPath = "$($installer.FullName).sig"
          $signature = (Get-Content $sigPath -Raw).Trim()

          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = ('{0}' -f (git tag --points-at HEAD | Select-Object -First 1))

          # Release notes stay empty until a changelog exists that is drawn
          # from milestone acceptance rather than reconstructed afterwards.
          $manifest = [ordered]@{
            version = $version
            notes = ''
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"
              }
            }
          }

          $path = 'apps/desktop/src-tauri/target/release/bundle/latest.json'
          $json = $manifest | ConvertTo-Json -Depth 6
          # Written byte-exact and without a BOM. A manifest that begins
          # with one is a manifest the updater cannot parse, and the two
          # PowerShell editions disagree about what "-Encoding utf8" means:
          # one writes a BOM, the other does not. This does not depend on
          # which one runs.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path $path),
            $json,
            (New-Object System.Text.UTF8Encoding $false)
          )
          Write-Host "latest.json -> $version, $($installer.Name)"
          Get-Content $path

      - name: Upload the installers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperlane-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/latest.json
          if-no-files-found: error

      - name: Open a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/latest.json
